name: Daily Auto Commit

on:
  schedule:
    # Runs twice daily at 00:00 UTC and 12:00 UTC (keeps streaks active across time zones)
    # Examples of alternative schedules:
    #   - '0 0 * * *'        (Once a day at midnight UTC)
    #   - '0 0,12 * * *'     (Twice daily at 00:00 and 12:00 UTC)
    #   - '0 6,18 * * *'     (Twice daily at 06:00 and 18:00 UTC)
    #   - '0 */6 * * *'      (Every 6 hours)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write # Needed to push commits back to repository

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run daily update script
        run: node update.js

      - name: Commit and push updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.json ACTIVITY.md README.md
          git commit -m "chore(auto-commit): daily streak update [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
